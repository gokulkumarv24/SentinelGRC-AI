# Continuous integration (spec §20.5). Bump pinned tool versions deliberately, never to "latest".
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.15.0"
  # Test-only values; production secrets come from the deployment platform.
  AUTH_SECRET: ci-test-only-secret-not-used-anywhere-else-0123456789
  TEST_DATABASE_URL: postgresql://sentinel:ci-only@localhost:5432/sentinelgrc_test
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, unit and component tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: API unit tests with coverage
        run: npm run test:cov -w services/api
      - name: Web component tests
        run: npm test -w apps/web
      - name: OpenAPI document is current
        run: |
          npm run build -w services/api
          npm run openapi -w services/api
          git diff --exit-code docs/openapi.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api-coverage, path: services/api/coverage, if-no-files-found: ignore }

  api-integration:
    name: API integration tests (migrations from an empty database)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4-bookworm
        env: { POSTGRES_USER: sentinel, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: sentinelgrc_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Integration and tenant-isolation tests (global setup migrates from empty)
        run: npm run test:api -w services/api
      - name: Schema has no drift from migrations
        env: { DATABASE_URL: "${{ env.TEST_DATABASE_URL }}" }
        run: npm run db:check-drift -w services/api

  build-and-smoke:
    name: Production build and startup smoke test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4-bookworm
        env: { POSTGRES_USER: sentinel, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: sentinelgrc_smoke }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://sentinel:ci-only@localhost:5432/sentinelgrc_smoke
      APP_ENV: development
      PUBLIC_APP_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Release step (migrations + reference data)
        run: |
          npm run db:migrate -w services/api
          npm run reference:sync -w services/api
      - name: Start API and run smoke and basic security checks
        run: |
          node services/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/v1/health && break; sleep 1; done
          curl -sf http://localhost:4000/api/v1/ready | grep -q '"database":"ok"'
          headers=$(curl -sI http://localhost:4000/api/v1/health)
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^content-security-policy:'
          ! echo "$headers" | grep -qi '^x-powered-by'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/v1/risks)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:4000/api/v1/risks)" = "401"
          ! curl -s http://localhost:4000/api/v1/ready | grep -qiE 'postgres|password|5432'
      - if: failure()
        run: cat api.log

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4-bookworm
        env: { POSTGRES_USER: sentinel, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: sentinelgrc_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://sentinel:ci-only@localhost:5432/sentinelgrc_unused
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e -w apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }

  security:
    name: Dependency, secret and image scans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Dependency vulnerabilities (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner
      - name: Build images
        run: |
          docker build -f services/api/Dockerfile --target runtime -t sentinelgrc-api:ci .
          docker build -f services/api/Dockerfile --target release -t sentinelgrc-release:ci .
          docker build -f apps/web/Dockerfile -t sentinelgrc-web:ci .
          docker build -t sentinelgrc-backup:ci ops/backup
      - name: Image vulnerability scan (fail on fixable critical)
        run: |
          for image in sentinelgrc-api:ci sentinelgrc-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"
          done

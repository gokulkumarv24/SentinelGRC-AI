# Render Blueprint — free-plan demo deployment (docs/DEPLOY_RENDER.md).
# Two free web services: the API (which also runs the background worker) and the web app.
# Values marked `sync: false` are entered by you in the Render dashboard; never commit them.
services:
  - type: web
    name: sentinelgrc-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: LOG_LEVEL
        value: info
      - key: AUTH_SECRET
        generateValue: true          # random 256-bit value created by Render
      - key: DATABASE_URL            # Neon *pooled* connection string
        sync: false
      - key: PUBLIC_APP_URL          # https://<your web service>.onrender.com
        sync: false
      - key: CORS_ORIGINS            # same value as PUBLIC_APP_URL
        sync: false
      - key: TRUST_PROXY             # Render runs behind Cloudflare, plus internal 10.x hops
        value: cloudflare
      - key: RUN_WORKER_IN_API       # free plan has no separate worker service
        value: "true"
      - key: WORKER_POLL_SECONDS
        value: "30"
      - key: DEMO_MODE
        value: "false"
      # Evidence and reports must go to object storage: free instances have no persistent disk.
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT             # e.g. https://s3.<region>.backblazeb2.com
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID_REF
        value: SENTINELGRC_S3_KEY_ID
      - key: S3_SECRET_ACCESS_KEY_REF
        value: SENTINELGRC_S3_SECRET
      - key: SENTINELGRC_S3_KEY_ID
        sync: false
      - key: SENTINELGRC_S3_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: none
      # AI assistant: off by default. To use Groq, set AI_ENABLED=true, AI_PROVIDER=openai-compatible,
      # AI_API_KEY and AI_DATA_SHARING_APPROVED=true in the dashboard (see docs/DEPLOY_RENDER.md).
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: mock

  - type: web
    name: sentinelgrc-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    autoDeploy: false
    envVars:
      - key: PORT
        value: "10000"
      # Compiled into the /api/v1 proxy at BUILD time: https://<your api service>.onrender.com
      - key: API_BASE_URL
        sync: false
